data_folder: ACTDR6MFLike/v1.0
input_file: dr6_data.fits
lmax: 9000

top_hat_band:

beam_profile: 
  beam_from_file: null

normalisation:
  nu_0: 150.0
  ell_0: 3000
  T_CMB: 2.725

experiments:
  - dr6_pa4_f220
  - dr6_pa5_f090
  - dr6_pa5_f150
  - dr6_pa6_f090
  - dr6_pa6_f150

bandint_freqs: [220, 90, 150, 90, 150]

components:
  tt:
    kSZ:
      FactorizedCrossSpectrum:
        - PowerSpectrumFromFile:
            filenames: ksz_bat
        - ConstantSED:
      params:
        - a_kSZ
    tSZ_and_CIB:
      CorrelatedCrossSpectrum:
        - PowerLawRescaledTemplate:
            filenames: tsz_150_bat
        - PowerLawRescaledTemplate:
            filenames: cib_Choi2020
            alpha_0: 0.8
        - PowerSpectrumFromFile:
            filenames: sz_x_cib
        - ThermalSZ:
        - ModifiedBlackBody:
      params:
        - a_tSZ
        - alpha_tSZ
        - a_c
        - alpha_c
        - xi
        - T_d
        - beta_cib
    cibp:
      FactorizedCrossSpectrum:
        - Poisson:
        - ModifiedBlackBody:
      params:
        - a_p
        - alpha_p
        - T_d
        - beta_cib
    radio:
      FactorizedCrossSpectrum:
        - Poisson:
        - PowerLawSED:
      params:
        - a_s
        - alpha_s
        - beta_s
    dust:
      FactorizedCrossSpectrum:
        - PowerLaw:
            ell_0: 500
        - ModifiedBlackBody:
      params:
        - a_gtt
        - alpha_dT
        - T_effd
        - beta_d
  te:
    radio:
      FactorizedCrossSpectrumTE:
        - Poisson:
        - PowerLawSED:
        - PowerLawSED:
      params:
        - a_pste
        - alpha_s
        - beta_s
        - beta_s
    dust:
      FactorizedCrossSpectrumTE:
        - PowerLaw:
            ell_0: 500
        - ModifiedBlackBody:
        - ModifiedBlackBody:
      params:
        - a_gte
        - alpha_dE
        - T_effd
        - beta_d
        - T_effd
        - beta_d
  ee:
    radio:
      FactorizedCrossSpectrum:
        - Poisson:
        - PowerLawSED:
      params:
        - a_psee
        - alpha_s
        - beta_s
    dust:
      FactorizedCrossSpectrum:
        - PowerLaw:
            ell_0: 500
        - ModifiedBlackBody:
      params:
        - a_gee
        - alpha_dE
        - T_effd
        - beta_d

restrict:
  T_d: 9.6
  T_effd: 19.6
  alpha_c: 0.8
  alpha_p: 1.0
  alpha_s: 1.0
  alpha_dT: -0.6
  alpha_dE: -0.4
  beta_d: 1.5
