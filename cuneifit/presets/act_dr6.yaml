data_folder: ACTDR6MFLike/v1.0

input_file: dr6_data.fits
n_ig: 2

requested_cls: ["tt", "te", "ee"]

defaults:
  symmetrize: false
  polarizations: [TT, TE, ET, EE]
  polarizations_auto: &polarizations_auto [TT, TE, EE]
  lmax: &lmax 8500
  scales:
    TT: [2, *lmax]
    TE: [2, *lmax]
    ET: [2, *lmax]
    EE: [2, *lmax]

data:
  experiments:
    - dr6_pa4_f220
    - dr6_pa5_f090
    - dr6_pa5_f150
    - dr6_pa6_f090
    - dr6_pa6_f150

  spectra:
    - experiments: [dr6_pa4_f220, dr6_pa4_f220]
      polarizations: &pol_pa4_f220 [TT]
      scales: &scales_pa4
        TT: [1000, *lmax]
    - experiments: [dr6_pa4_f220, dr6_pa5_f090]
      polarizations: *pol_pa4_f220
      scales: *scales_pa4
    - experiments: [dr6_pa4_f220, dr6_pa5_f150]
      polarizations: *pol_pa4_f220
      scales: *scales_pa4
    - experiments: [dr6_pa4_f220, dr6_pa6_f090]
      polarizations: *pol_pa4_f220
      scales: *scales_pa4
    - experiments: [dr6_pa4_f220, dr6_pa6_f150]
      polarizations: *pol_pa4_f220
      scales: *scales_pa4

    - experiments: [dr6_pa5_f090, dr6_pa5_f090]
      polarizations: *polarizations_auto
      scales:
        TT: [1000, *lmax]
        TE: [1000, *lmax]
        EE: [1000, *lmax]
    - experiments: [dr6_pa5_f090, dr6_pa5_f150]
      scales:
        TT: [1000, *lmax]
        TE: [1000, *lmax]
        ET: [1000, *lmax]
        EE: [1000, *lmax]
    - experiments: [dr6_pa5_f090, dr6_pa6_f090]
      scales:
        TT: [1000, *lmax]
        TE: [1000, *lmax]
        ET: [1000, *lmax]
        EE: [1000, *lmax]
    - experiments: [dr6_pa5_f090, dr6_pa6_f150]
      scales:
        TT: [1000, *lmax]
        TE: [1000, *lmax]
        ET: [1000, *lmax]
        EE: [1000, *lmax]

    - experiments: [dr6_pa5_f150, dr6_pa5_f150]
      polarizations: *polarizations_auto
      scales:
        TT: [800, *lmax]
        TE: [800, *lmax]
        EE: [800, *lmax]
    - experiments: [dr6_pa5_f150, dr6_pa6_f090]
      scales:
        TT: [1000, *lmax]
        TE: [1000, *lmax]
        ET: [1000, *lmax]
        EE: [1000, *lmax]
    - experiments: [dr6_pa5_f150, dr6_pa6_f150]
      scales:
        TT: [800, *lmax]
        TE: [800, *lmax]
        ET: [800, *lmax]
        EE: [800, *lmax]

    - experiments: [dr6_pa6_f090, dr6_pa6_f090]
      polarizations: *polarizations_auto
      scales:
        TT: [1000, *lmax]
        TE: [1000, *lmax]
        EE: [1000, *lmax]
    - experiments: [dr6_pa6_f090, dr6_pa6_f150]
      scales:
        TT: [1000, *lmax]
        TE: [1000, *lmax]
        ET: [1000, *lmax]
        EE: [1000, *lmax]

    - experiments: [dr6_pa6_f150, dr6_pa6_f150]
      polarizations: *polarizations_auto
      scales:
        TT: [600, *lmax]
        TE: [600, *lmax]
        EE: [600, *lmax]

restrict:
  calE_dr6_pa4_f220: 1.0

priors:
  - "lambda calG_all: jsc.stats.norm.logpdf(calG_all, loc=1.0, scale=0.003)"
  - "lambda cal_dr6_pa4_f220: jsc.stats.norm.logpdf(cal_dr6_pa4_f220, loc=1.0, scale=0.013)"
  - "lambda cal_dr6_pa5_f090: jsc.stats.norm.logpdf(cal_dr6_pa5_f090, loc=1.0, scale=0.0016)"
  - "lambda cal_dr6_pa5_f150: jsc.stats.norm.logpdf(cal_dr6_pa5_f150, loc=1.0, scale=0.0020)"
  - "lambda cal_dr6_pa6_f090: jsc.stats.norm.logpdf(cal_dr6_pa6_f090, loc=1.0, scale=0.0018)"
  - "lambda cal_dr6_pa6_f150: jsc.stats.norm.logpdf(cal_dr6_pa6_f150, loc=1.0, scale=0.0024)"
  - "lambda bandint_shift_dr6_pa4_f220: jsc.stats.norm.logpdf(bandint_shift_dr6_pa4_f220, loc=0.0, scale=3.6)"
  - "lambda bandint_shift_dr6_pa5_f090: jsc.stats.norm.logpdf(bandint_shift_dr6_pa5_f090, loc=0.0, scale=1.0)"
  - "lambda bandint_shift_dr6_pa5_f150: jsc.stats.norm.logpdf(bandint_shift_dr6_pa5_f150, loc=0.0, scale=1.3)"
  - "lambda bandint_shift_dr6_pa6_f090: jsc.stats.norm.logpdf(bandint_shift_dr6_pa6_f090, loc=0.0, scale=1.2)"
  - "lambda bandint_shift_dr6_pa6_f150: jsc.stats.norm.logpdf(bandint_shift_dr6_pa6_f150, loc=0.0, scale=1.1)"
