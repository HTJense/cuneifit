data_folder: ACTDR6CMBonly/v1.0

input_file: dr6_data_cmbonly.fits

requested_cls: ["tt", "te", "ee"]

defaults:
  symmetrize: false
  polarizations: [TT, TE, EE]
  lmax: &lmax 6500
  scales:
    TT: [2, *lmax]
    TE: [2, *lmax]
    ET: [2, *lmax]
    EE: [2, *lmax]

data:
  experiments:
    - dr6_cmb

  spectra:
    - experiments: [dr6_cmb, dr6_cmb]
      polarizations: [TT, TE, EE]
      scales:
        TT: [600, *lmax]
        TE: [600, *lmax]
        EE: [600, *lmax]

