[project]
name = "DFLike"
version = "2026"
description = "JAX implementations of Simons Observatory CMB Likelihoods."
readme = "README.md"
license = "CC-BY-4.0"

dependencies = [
	"numpy",
	"scipy",
	"astropy",
	"jax<=0.9.0.1",
	"sacc",
	"optax",
]

authors = [
	{name = "Hidde T. Jense", email="jenseh@cardiff.ac.uk"},
]
maintainers = [
	{name = "Hidde T. Jense", email="jenseh@cardiff.ac.uk"},
]

classifiers = [
	"Development Status :: 4 - Beta",
	"Intended Audience :: Science/Research",
	"Programming Language :: Python 3",
	"Topic :: Scientific/Engineering :: Astronomy"
]

[project.optional-dependencies]
cobaya = ["cobaya"]

[tool.setuptools.packages.find]
where = ["dflike"]
