[project]
name = "cuneifit"
version = "0.1.0"
description = "JAX implementations of Simons Observatory CMB Likelihoods."
readme = "README.md"
license = "CC-BY-4.0"

dependencies = [
	"numpy",
	"scipy",
	"astropy",
	"jax<=0.9.0.1",
	"sacc",
	"optax",
	"pytest",
]

authors = [
	{name = "Hidde T. Jense", email="jenseh@cardiff.ac.uk"},
]
maintainers = [
	{name = "Hidde T. Jense", email="jenseh@cardiff.ac.uk"},
]

classifiers = [
	"Development Status :: 4 - Beta",
	"Intended Audience :: Science/Research",
	"Programming Language :: Python :: 3",
	"Topic :: Scientific/Engineering :: Astronomy"
]

[project.urls]
Repository = "https://github.com/HTJense/cuneifit"
Documentation = "https://cuneifit.readthedocs.io"
Issues = "https://github.com/HTJense/cuneifit/issues"

[project.optional-dependencies]
cobaya = ["cobaya"]

[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["cuneifit"]

[tool.setuptools.package-data]
cuneifit = ["data/*", "presets/*.yaml"]

[tool.pytest]
testpaths = ["tests"]
