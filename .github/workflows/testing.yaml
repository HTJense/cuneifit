name: Testing

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: ubuntu-latest
          python-version: '3.11'
          tags: []
        - os: ubuntu-latest
          python-version: '3.12'
          tags: []
        - os: ubuntu-latest
          python-version: '3.13'
          tags: []
        - os: ubuntu-latest
          python-version: '3.14'
          tags: []
        - os: ubuntu-latest
          python-version: '3.15'
          tags: []

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Install cuneifit
      run: |
        python -m pip install .
    - name: Download DR6 data
      continue-on-error: true
      run: |
        echo "DR6_DATA_DIR=" >> "$GITHUB_ENV"
        mkdir dr6_data/ACTDR6CMBonly
        mkdir dr6_data/ACTDR6MFLike
        cd dr6_data/ACTDR6CMBonly
        wget https://lambda.gsfc.nasa.gov/data/act/pspipe/sacc_files/dr6_data_cmbonly.tar.gz
        tar -zxf dr6_data_cmbonly.tar.gz
        cd ../ACTDR6MFLike
        wget https://lambda.gsfc.nasa.gov/data/act/pspipe/sacc_files/dr6_data.tar.gz
        tar -zxf dr6_data.tar.gz
        cd ../..
        echo "DR6_DATA_DIR=dr6_data" >> "$GITHUB_ENV"
    - name: Install cosmopower
      continue-on-error: true
      run: |
        echo "CP_DATA_DIR=" >> "$GITHUB_ENV"
        git clone https://github.com/HTJense/cosmopower.git
        cd cosmopower
        python -m pip install .
        python -m pip install cosmopower-jax
        cd ..
        git clone https://github.com/cosmopower-organization/jense_2024_emulators.git
        echo "CP_DATA_DIR=jense_2024_emulators" >> "$GITHUB_ENV"
    - name: Test with pytest
      run: |
        test_args=()
        if [ -n "$CP_DATA_DIR" ]; then
          test_args+=(--emu-dir="$CP_DATA_DIR")
        fi
        if [ -n "$DR6_DATA_DIR" ]; then
          test_args+=(--dr6-dir="$DR6_DATA_DIR")
        fi
        pytest "${test_args[@]}"
