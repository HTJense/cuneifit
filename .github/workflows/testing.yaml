name: Testing

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: ubuntu-latest
          python-version: '3.11'
          tags: []
        - os: ubuntu-latest
          python-version: '3.12'
          tags: []
        - os: ubuntu-latest
          python-version: '3.13'
          tags: []
        - os: ubuntu-latest
          python-version: '3.14'
          tags: []
        - os: ubuntu-latest
          python-version: '3.15'
          tags: []

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Install cuneifit
      run: |
        python -m pip install .
    - name: Install cosmopower
      continue-on-error: true
      run: |
        git clone https://github.com/HTJense/cosmopower.git
        cd cosmopower
        python -m pip install .
        python -m pip install cosmopower-jax
        cd ..
        git clone https://github.com/cosmopower-organization/jense_2024_emulators.git
    - name: Test with pytest
      run: |
        pytest
